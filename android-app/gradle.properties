org.gradle.jvmargs=-Xmx1024m -Dfile.encoding=UTF-8 -Djava.net.preferIPv6Addresses=true
org.gradle.workers.max=1
# This VM cannot run the Gradle daemon (its client/daemon handshake
# fails here), and the Kotlin compiler daemon has the same problem —
# build everything in-process, single worker, low memory.
# Loopback fix: Java TCP to 127.0.0.1 is intercepted in this sandbox
# (the client receives a "muse: Other TCP ..." message instead of the
# daemon), but Java TCP to ::1 works — so prefer IPv6 loopback.
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
